<!doctype html>
<!--
  O `lang` ESTÁTICO é o PADRÃO DO PRODUTO, e o produto abre em inglês.

  Era `pt-BR` — uma língua que este documento não tem como saber. O app monta
  em `en` (`lang.tsx`: o padrão quando não há `?lang=` nem escolha guardada) e
  só troca pro idioma da casa quando o `/api/check` responde. Então o
  documento declarava português, o leitor de tela era avisado de português, e
  a primeira coisa renderizada era inglês. Mesma família do `<title>` que
  piscava: afirmação de idioma feita antes de o idioma se saber.

  Aqui não é escolha editorial — é um valor que tem que casar com
  `lang.tsx`, e o `i18n.test.ts` exige que case. O efeito do `lang.tsx`
  corrige depois do mount; isto é o que vale até lá.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <!--
      O TOKEN DA CONTA NÃO SAI DAQUI NO `Referer`.

      A conta do cliente é `/?t=<token>`, e esse token é uma CAPACIDADE ao
      portador: com ele se lê a conta (`/api/check`) e se CRIA cobrança
      (`/api/pay` autoriza só por ele, `router.js`). O navegador manda a URL
      inteira da página no `Referer` de todo subrecurso de terceiro — e numa
      casa com cartão isso incluía a Stripe (`m.stripe.com`).

      `strict-origin` manda só a origem, nunca o caminho nem a query. Quem
      precisa da origem (a Stripe precisa, pra casar o domínio) continua
      recebendo; o token não. LGPD art. 46. Achado pela revisão de compliance
      de 2026-09-10.

      O conserto durável é o token sair da query string; isto fecha o vazamento
      hoje, em uma linha, sem mexer no formato do QR que já está impresso.
    -->
    <meta name="referrer" content="strict-origin" />
    <!-- O TÍTULO ESTÁTICO É A MARCA, sem frase.
         Era "Racha — pay at the table", e o idioma real só se sabe depois que o
         `/api/check` responde com o `defaultLang` da casa: numa mesa brasileira
         a aba mostrava inglês até a resposta chegar e então virava português.
         A marca não tem idioma, então não há o que piscar — o `lang.tsx` põe a
         frase assim que o idioma se resolve. Achado testando no navegador,
         2026-09-13. -->
    <title>Racha</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS: instalável pela folha de compartilhar ("Adicionar à Tela de Início") -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Racha" />
    <!-- Fontes servidas daqui (/fonts), não de CDN: ver @font-face em styles.css. -->
    <!-- SEM preload da itálica.
         Ela é usada (`.venue`, o nome da casa), mas só DEPOIS que o
         `/api/check` responde — e o navegador avisava, a cada carga, que o
         recurso pré-carregado não fora usado a tempo. Pré-carregar uma fonte
         que depende de uma ida ao servidor não adianta nada: ela disputa banda
         justamente com a chamada que a destrava. Sai o preload; o `@font-face`
         busca quando o texto existe. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
